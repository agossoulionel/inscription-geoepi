<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inscriptions RUC · Géoépidémiologie</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1B3D">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inscriptions RUC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--orange:#E8590C;--ambre:#F5A524;--rouge:#C2321F;--marine:#0F1B3D;--gris:#5A6478;--bord:#E3DED3;--fond:#F3F1EC}
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:'Poppins',Arial,sans-serif;color:var(--marine);background:var(--fond);position:relative}
  body:before{content:"";position:fixed;inset:0;background:url(carte.jpg) 60% 40%/cover no-repeat;opacity:.55;z-index:-2}
  body:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(243,241,236,.95),rgba(243,241,236,.8) 50%,rgba(243,241,236,.95));z-index:-1}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px}
  .marque{display:flex;align-items:center;gap:12px}
  .logo{width:56px;height:56px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,27,61,.12)}
  .logo img{width:48px}
  .nom{font-weight:500;font-size:14px;letter-spacing:4px;line-height:1.3}.nom b{display:block;color:var(--orange)}
  .k{margin:34px 0 2px;font-weight:700;font-size:14px;letter-spacing:5px;color:var(--gris)}
  h1{margin:0;font-weight:700;font-size:clamp(30px,10vw,44px);letter-spacing:-1.5px;line-height:1.05;background:linear-gradient(90deg,var(--ambre),var(--orange) 50%,var(--rouge));-webkit-background-clip:text;background-clip:text;color:transparent}
  .s{margin:6px 0 28px;font-weight:500;color:var(--gris)}
  a.carte{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--bord);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 12px 32px rgba(15,27,61,.08);position:relative;overflow:hidden}
  a.carte:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--ambre),var(--orange))}
  a.carte.b:before{background:var(--marine)}
  .ic{width:60px;height:60px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(232,89,12,.1)}
  .b .ic{background:rgba(15,27,61,.08)}
  .t{font-weight:700;font-size:20px;line-height:1.2}
  .d{font-size:14px;color:var(--gris);margin-top:2px}
  .fl{margin-left:auto;font-size:26px;color:var(--orange);font-weight:700}
  .partage{width:100%;margin-top:6px;font-family:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;padding:15px;color:#fff;background:var(--marine);cursor:pointer}
  .msg{display:none;text-align:center;margin-top:10px;font-size:14px;color:var(--orange);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="marque"><div class="logo"><img src="logo.png" alt=""></div><div class="nom">R USERS<b>COMMUNITY</b></div></div>
  <p class="k">FORMATION EN</p>
  <h1>Géoépidémiologie</h1>
  <p class="s">Que voulez-vous ouvrir ?</p>

  <a class="carte" href="index.html">
    <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E8590C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <div><div class="t">Formulaire d'inscription</div><div class="d">Inscrire un participant</div></div>
    <div class="fl">›</div>
  </a>
  <a class="carte b" href="stats.html">
    <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0F1B3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
    <div><div class="t">Tableau de bord</div><div class="d">Suivre les inscriptions en direct</div></div>
    <div class="fl">›</div>
  </a>

  <button class="partage" id="partager">Partager le lien d'inscription</button>
  <p class="msg" id="msg">Lien copié</p>
</div>
<script>
const LIEN = "https://agossoulionel.github.io/inscription-geoepi/";
document.getElementById("partager").onclick = async () => {
  const texte = "Formation 100 % gratuite en géoépidémiologie : modélisation spatiale et cartographie des risques sanitaires avec R, QGIS et ArcGIS. Inscription :";
  if (navigator.share) { try { await navigator.share({ title: "Inscription formation géoépidémiologie", text: texte, url: LIEN }); return; } catch (e) { return; } }
  try { await navigator.clipboard.writeText(texte + " " + LIEN); const m = document.getElementById("msg"); m.style.display = "block"; setTimeout(() => m.style.display = "none", 2500); }
  catch (e) { prompt("Copiez ce lien :", LIEN); }
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
